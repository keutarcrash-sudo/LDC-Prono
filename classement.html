<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classement — Ligue des Champions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0e1116; color: #eaeef2; padding: 40px; }
  h1 { font-size: 2.2rem; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #9aa4b2; margin-bottom: 40px; font-size: 1.2rem; }
  .columns { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .col { flex: 1; min-width: 360px; max-width: 520px; }
  .col h2 { font-size: 1.5rem; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 1.3rem; }
  td { padding: 10px 6px; border-bottom: 1px solid #2a2f3a; }
  .rank { color: #9aa4b2; width: 40px; }
  .rank.gold { color: #ffd700; font-weight: bold; }
  .rank.silver { color: #c0c0c0; font-weight: bold; }
  .rank.bronze { color: #cd7f32; font-weight: bold; }
  .points { text-align: right; font-weight: 700; color: #3b82f6; }
  .empty { color: #6b7280; font-style: italic; padding: 20px 0; }
</style>
</head>
<body>
  <h1>🏆 Classement — Ligue des Champions</h1>
  <div class="subtitle" id="soireeLabel">Chargement…</div>

  <div class="columns">
    <div class="col">
      <h2>Classement du soir</h2>
      <table id="tableSoiree"><tbody></tbody></table>
    </div>
    <div class="col">
      <h2>Classement de la saison</h2>
      <table id="tableSaison"><tbody></tbody></table>
    </div>
  </div>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function rankClass(i) {
      if (i === 0) return "rank gold";
      if (i === 1) return "rank silver";
      if (i === 2) return "rank bronze";
      return "rank";
    }

    function renderTable(tableId, rows, pointsKey) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td class="empty" colspan="3">Aucun pronostic pour l'instant</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((r, i) => `
        <tr>
          <td class="${rankClass(i)}">${i + 1}</td>
          <td>${r.pseudo}</td>
          <td class="points">${r[pointsKey] ?? 0} pts</td>
        </tr>
      `).join("");
    }

    async function refresh() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const { data: soiree } = await sb.from("soirees").select("*").eq("date", todayStr).order("created_at", { ascending: false }).limit(1).maybeSingle();

      document.getElementById("soireeLabel").textContent = soiree
        ? (soiree.label || `Soirée du ${soiree.date}`)
        : "Pas de soirée aujourd'hui — classement de la saison ci-dessous";

      if (soiree) {
        const { data: classementSoiree } = await sb.from("classement_soiree")
          .select("*").eq("soiree_id", soiree.id).order("points_soiree", { ascending: false }).limit(10);
        renderTable("tableSoiree", classementSoiree, "points_soiree");
      } else {
        renderTable("tableSoiree", [], "points_soiree");
      }

      const { data: classementSaison } = await sb.from("classement_saison")
        .select("*").order("points_total", { ascending: false }).limit(10);
      renderTable("tableSaison", classementSaison, "points_total");
    }

    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
