<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Classement — Predicto Arena 18</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #15223B;
    --surface-2: #1B2C4C;
    --border: #253758;
    --accent: #1E90FF;
    --accent-bright: #00F0FF;
    --gold: #FFD600;
    --silver: #C7D2E3;
    --bronze: #D89B5D;
    --success: #00E6A1;
    --text: #FFFFFF;
    --text-muted: #8B96AC;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; }
  body { overflow-x: hidden; overscroll-behavior-x: none; }
  button, a, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Manrope', system-ui, sans-serif; margin: 0; color: var(--text); padding: 48px 40px 110px;
    background: linear-gradient(rgba(10,15,28,0.5), rgba(10,15,28,0.72)), url('assets/trophy.jpg') center/cover no-repeat fixed, var(--bg);
  }

  .svg-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.15em; }
  .svg-icon svg { width: 1em; height: 1em; display: block; }
  .trophy-glow { animation: trophy-pulse 2.6s ease-in-out infinite; }
  @keyframes trophy-pulse {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(255,214,0,0)); color: var(--gold); }
    50% { filter: drop-shadow(0 0 14px rgba(255,214,0,0.75)); color: #fff2a8; }
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 3.4rem; letter-spacing: 1px;
    text-align: center; margin: 0; line-height: 1.05;
  }
  .tagline { text-align: center; color: var(--gold); font-style: italic; font-size: 1.05rem; margin: 10px 0 0; font-family: 'Manrope', sans-serif; font-weight: 700; }
  .subtitle-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 44px; flex-wrap: wrap; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--success); background: rgba(0,230,161,0.12); border: 1px solid rgba(0,230,161,0.3); padding: 4px 10px; border-radius: 999px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: live-blink 1.4s ease-in-out infinite; }
  @keyframes live-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .columns { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; align-items: flex-start; }
  .col {
    flex: 1; min-width: 380px; max-width: 560px; background: rgba(21,34,59,0.88); backdrop-filter: blur(2px);
    border: 1px solid var(--border); border-radius: 18px; padding: 24px 28px 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .col.saison { border-color: rgba(255,214,0,0.35); }
  .col-kicker {
    font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 0.72rem; letter-spacing: 1.6px;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
  }
  .col-kicker.gold { color: var(--gold); }
  .col h2 {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; letter-spacing: 0.5px;
    border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin: 0 0 6px;
  }
  .col.saison h2 { border-bottom-color: var(--gold); }
  .roi-tag {
    display: block; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 0.68rem;
    letter-spacing: 0.6px; text-transform: uppercase; color: var(--gold); margin-top: -6px; margin-bottom: 8px;
  }

  .footix-zone { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(255,92,108,0.4); }
  .footix-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.5px;
    color: #FF8FA3; margin-bottom: 8px;
  }
  .footix-row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.05rem; }
  .footix-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footix-pts { color: #FF8FA3; flex-shrink: 0; margin-left: 10px; }
  .footix-quip { color: var(--text-muted); font-size: 0.84rem; font-style: italic; margin-top: 5px; }

  /* Podium (top 3) */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 22px 0 8px; }
  .podium-place {
    display: flex; flex-direction: column; align-items: center; width: 32%; max-width: 180px; min-width: 92px;
    opacity: 0; transform: translateY(18px); animation: podium-in 0.55s ease forwards;
  }
  .podium-place.place-2 { animation-delay: 0.05s; }
  .podium-place.place-1 { animation-delay: 0.2s; }
  .podium-place.place-3 { animation-delay: 0.35s; }
  @keyframes podium-in { to { opacity: 1; transform: translateY(0); } }

  .podium-medal { font-size: 1.5rem; margin-bottom: 2px; }
  .podium-avatar {
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: white; margin-bottom: 8px;
    border: 2px solid var(--border);
  }
  .place-1 .podium-avatar { width: 68px; height: 68px; font-size: 1.7rem; border-color: var(--gold); box-shadow: 0 0 18px rgba(255,214,0,0.55); }
  .place-2 .podium-avatar { border-color: var(--silver); }
  .place-3 .podium-avatar { border-color: var(--bronze); }
  .podium-name { font-weight: 800; font-size: 0.92rem; margin-bottom: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-pts { font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; color: var(--accent-bright); margin-bottom: 10px; letter-spacing: 0.5px; white-space: nowrap; }
  .col.saison .podium-pts { color: var(--gold); }
  .place-1 .podium-pts { font-size: 1.55rem; }
  .podium-bar {
    width: 100%; border-radius: 10px 10px 0 0; border: 1px solid var(--border); border-bottom: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
  }
  .place-1 .podium-bar { height: 36px; border-color: var(--gold); background: linear-gradient(180deg, rgba(255,214,0,0.28), rgba(255,214,0,0.04)); }
  .place-2 .podium-bar { height: 24px; border-color: var(--silver); }
  .place-3 .podium-bar { height: 16px; border-color: var(--bronze); }

  /* Rest of the list (4th+) */
  .rest-list { margin-top: 8px; }
  .rest-row {
    display: flex; justify-content: space-between; align-items: center; padding: 11px 4px;
    border-bottom: 1px solid var(--border); opacity: 0; animation: row-in 0.4s ease forwards;
  }
  .rest-row:last-child { border-bottom: none; }
  @keyframes row-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .rest-rank { color: var(--text-muted); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; width: 32px; flex-shrink: 0; }
  .rest-name { flex: 1; font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rest-pts { font-weight: 800; color: var(--accent-bright); font-size: 1.05rem; }
  .col.saison .rest-pts { color: var(--gold); }
  @keyframes flash-update { 0% { background: rgba(255,214,0,0.35); } 100% { background: transparent; } }
  .flash { animation: flash-update 1.4s ease; border-radius: 8px; }

  .empty { color: var(--text-muted); font-style: italic; padding: 24px 4px; font-size: 1.05rem; text-align: center; }

  .clickable-name { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .clickable-name:hover { color: var(--accent-bright); }

  [hidden] { display: none !important; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(4,7,14,0.78); backdrop-filter: blur(2px);
    z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    max-width: 480px; width: 100%; max-height: 78vh; overflow-y: auto; padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-close {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-size: 1.1rem;
    cursor: pointer; line-height: 1; padding: 6px 12px; border-radius: 8px; flex-shrink: 0;
  }
  .modal-close:hover { border-color: var(--accent-bright); }

  .team-badge { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); vertical-align: middle; }
  .team-badge img { width: 100%; height: 100%; object-fit: contain; }
  .team-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 0.65rem; background: linear-gradient(135deg, var(--accent), #0e4f8f); color: white; }

  .profile-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .profile-row:last-child { border-bottom: none; }
  .profile-row-info { flex: 1; min-width: 0; }
  .profile-row-date { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
  .profile-row-match { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 0.92rem; flex-wrap: wrap; }
  .profile-row-pred { color: var(--text-muted); font-size: 0.78rem; margin-top: 3px; }
  .profile-pts { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.5px; padding: 5px 12px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
  .profile-pts.p5 { background: rgba(255,214,0,0.18); color: var(--gold); }
  .profile-pts.p3 { background: rgba(30,144,255,0.18); color: var(--accent-bright); }
  .profile-pts.p1 { background: rgba(139,150,172,0.15); color: var(--text-muted); }

  @media (max-width: 820px) {
    .columns { flex-direction: column; align-items: stretch; }
    .col { max-width: 100%; min-width: 0; width: 100%; }
  }

  @media (max-width: 600px) {
    body { padding: 24px 16px 110px; }
    h1 { font-size: 1.9rem; }
    .subtitle { font-size: 0.95rem; }
    .subtitle-row { margin-bottom: 24px; }
    .col { padding: 18px 16px 8px; }
  }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; max-width: 480px; margin: 0 auto;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-muted); text-decoration: none; font-size: 0.65rem;
    text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700;
  }
  .nav-item.active { color: var(--accent-bright); }
  .nav-icon { font-size: 1.3rem; }
</style>
</head>
<body>
  <h1><span class="svg-icon trophy-glow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3"/><path d="M12 12v3"/><path d="M8 20h8"/><path d="M9 20v-2a3 3 0 016 0v2"/></svg></span> Classement Predicto</h1>
  <p class="tagline">Tu penses connaître le score ? Prouve-le.</p>
  <div class="subtitle-row">
    <div class="subtitle" id="soireeLabel">Chargement…</div>
    <span class="live-badge"><span class="live-dot"></span> En direct</span>
  </div>

  <div class="columns">
    <div class="col">
      <div class="col-kicker">Ce soir</div>
      <h2>🏆 Classement Predicto</h2>
      <div class="podium" id="podiumSoiree"></div>
      <div class="rest-list" id="restSoiree"></div>
      <div class="footix-zone" id="footixSoiree"></div>
    </div>
    <div class="col saison">
      <div class="col-kicker gold">Qui sera le Footix de la saison ?</div>
      <h2>🏆 Classement Predicto</h2>
      <div class="podium" id="podiumSaison"></div>
      <div class="rest-list" id="restSaison"></div>
      <div class="footix-zone" id="footixSaison"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="playerModal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalPseudo">Joueur</div>
        <button class="modal-close" id="modalClose" type="button">✕ Fermer</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="pronostics.html" class="nav-item" id="navPronostics"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l3 2.2-1.1 3.6H10.1L9 9.2 12 7z" fill="currentColor" stroke="none"/><path d="M12 3v4M12 17v4M4.5 8l3.5 1M16 9l3.5-1M6 17l2.5-2.5M15.5 14.5L18 17"/></svg></span><span>Pronostics</span></a>
    <a href="classement.html" class="nav-item active"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3"/><path d="M12 12v3"/><path d="M8 20h8"/><path d="M9 20v-2a3 3 0 016 0v2"/></svg></span><span>Classement</span></a>
    <a href="profil.html" class="nav-item"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></span><span>Profil</span></a>
  </nav>

  <script>
    (function () {
      const lastCode = localStorage.getItem("ldc_last_code");
      if (lastCode) document.getElementById("navPronostics").href = `pronostics.html?code=${lastCode}`;
    })();
  </script>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const previousPoints = { soiree: {}, saison: {} };

    const FOOTIX_QUIPS = [
      "On croit encore en toi.",
      "Il reste toute une saison pour remonter.",
      "La Zone Footix, mais avec le sourire.",
      "Prochain match : une nouvelle chance de sauver ton honneur.",
      "La honte est éternelle. Le classement aussi.",
    ];

    function escAttr(str) {
      return String(str ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    }

    function teamBadge(name, logoUrl) {
      const initial = (name || "?").charAt(0).toUpperCase();
      const fallback = `<span class="team-fallback" style="${logoUrl ? "display:none;" : ""}">${initial}</span>`;
      const img = logoUrl
        ? `<img src="${logoUrl}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />`
        : "";
      return `<span class="team-badge">${img}${fallback}</span>`;
    }

    async function openPlayerModal(joueurId, pseudo) {
      document.getElementById("modalPseudo").textContent = pseudo;
      const bodyEl = document.getElementById("modalBody");
      bodyEl.innerHTML = `<p class="empty" style="padding:12px 0;">Chargement…</p>`;
      document.getElementById("playerModal").hidden = false;

      const { data: pronos, error } = await sb
        .from("pronostics")
        .select("*, matchs(equipe_domicile, equipe_exterieur, logo_domicile, logo_exterieur, score_domicile, score_exterieur, coup_envoi, soirees(label, date))")
        .eq("joueur_id", joueurId)
        .gt("points", 0)
        .order("coup_envoi", { foreignTable: "matchs", ascending: false });

      const goodOnes = (pronos || []).filter(p => p.matchs);
      if (error || goodOnes.length === 0) {
        bodyEl.innerHTML = `<p class="empty" style="padding:12px 0;">Pas encore de bon pronostic pour ${pseudo}.</p>`;
        return;
      }

      bodyEl.innerHTML = goodOnes.map(p => {
        const m = p.matchs;
        const dateStr = new Date(m.coup_envoi).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
        const soireeLabel = m.soirees?.label || (m.soirees?.date ? `Soirée du ${m.soirees.date}` : "");
        const ptsClass = p.points === 5 ? "p5" : p.points === 3 ? "p3" : "p1";
        const ptsLabel = p.points === 5 ? "🎯 5 pts" : `${p.points} pt${p.points > 1 ? "s" : ""}`;
        return `
          <div class="profile-row">
            <div class="profile-row-info">
              <div class="profile-row-date">${dateStr}${soireeLabel ? " — " + soireeLabel : ""}</div>
              <div class="profile-row-match">${teamBadge(m.equipe_domicile, m.logo_domicile)} ${m.equipe_domicile} vs ${teamBadge(m.equipe_exterieur, m.logo_exterieur)} ${m.equipe_exterieur}</div>
              <div class="profile-row-pred">Prono : ${p.score_domicile_predit}-${p.score_exterieur_predit} · Résultat : ${m.score_domicile}-${m.score_exterieur}</div>
            </div>
            <div class="profile-pts ${ptsClass}">${ptsLabel}</div>
          </div>
        `;
      }).join("");
    }

    function closePlayerModal() {
      document.getElementById("playerModal").hidden = true;
    }
    document.getElementById("modalClose").addEventListener("click", closePlayerModal);
    document.getElementById("playerModal").addEventListener("click", (e) => {
      if (e.target.id === "playerModal") closePlayerModal();
    });
    document.addEventListener("click", (e) => {
      const nameEl = e.target.closest(".clickable-name");
      if (nameEl && nameEl.dataset.joueurId) {
        openPlayerModal(nameEl.dataset.joueurId, nameEl.dataset.pseudo);
      }
    });

    function avatarColor(seed) {
      const colors = ["#1E90FF", "#00E6A1", "#FFD600", "#7C6CE0", "#FF5C6C", "#00C2D1"];
      let hash = 0;
      for (const ch of seed) hash = (hash * 31 + ch.charCodeAt(0)) % colors.length;
      return colors[Math.abs(hash) % colors.length];
    }

    function quipFor(seed) {
      let hash = 0;
      for (const ch of seed) hash = (hash * 31 + ch.charCodeAt(0)) % FOOTIX_QUIPS.length;
      return FOOTIX_QUIPS[Math.abs(hash) % FOOTIX_QUIPS.length];
    }

    function renderColumn(key, rows, pointsKey, podiumEl, restEl, footixEl) {
      if (!rows || rows.length === 0) {
        podiumEl.innerHTML = "";
        restEl.innerHTML = `<div class="empty">Aucun prono pour l'instant</div>`;
        footixEl.innerHTML = "";
        previousPoints[key] = {};
        return;
      }

      const top3 = rows.slice(0, 3);
      const rest = rows.slice(3, 10);
      const medals = ["🥇", "🥈", "🥉"];
      const order = [1, 0, 2]; // affichage visuel : 2e - 1er - 3e

      podiumEl.innerHTML = order
        .filter(i => top3[i])
        .map(i => {
          const r = top3[i];
          const pts = r[pointsKey] ?? 0;
          const initial = (r.pseudo || "?").charAt(0).toUpperCase();
          const roiTag = i === 0 ? `<div class="roi-tag">👑 Roi du prono</div>` : "";
          return `
            <div class="podium-place place-${i + 1}">
              <div class="podium-medal">${medals[i]}</div>
              <div class="podium-avatar" style="background: linear-gradient(135deg, ${avatarColor(r.pseudo || "?")}, #0e1524)">${initial}</div>
              <div class="podium-name clickable-name" data-joueur-id="${r.joueur_id}" data-pseudo="${escAttr(r.pseudo)}">${r.pseudo}</div>
              <div class="podium-pts">${pts} pts</div>
              ${roiTag}
              <div class="podium-bar"></div>
            </div>
          `;
        }).join("");

      restEl.innerHTML = rest.map((r, idx) => {
        const pts = r[pointsKey] ?? 0;
        const changed = previousPoints[key][r.joueur_id] !== undefined && previousPoints[key][r.joueur_id] !== pts;
        return `
          <div class="rest-row ${changed ? "flash" : ""}" style="animation-delay:${idx * 0.05}s">
            <span class="rest-rank">${idx + 4}</span>
            <span class="rest-name clickable-name" data-joueur-id="${r.joueur_id}" data-pseudo="${escAttr(r.pseudo)}">${r.pseudo}</span>
            <span class="rest-pts">${pts} pts</span>
          </div>
        `;
      }).join("");

      // La Zone Footix ne s'affiche qu'à partir de 4 joueurs, pour ne pas
      // pointer quelqu'un du doigt sur un classement encore presque vide.
      if (rows.length >= 4) {
        const last = rows[rows.length - 1];
        const pts = last[pointsKey] ?? 0;
        footixEl.innerHTML = `
          <div class="footix-label">🤡 Zone Footix</div>
          <div class="footix-row">
            <span class="footix-name clickable-name" data-joueur-id="${last.joueur_id}" data-pseudo="${escAttr(last.pseudo)}">${last.pseudo}</span>
            <span class="footix-pts">${pts} pts</span>
          </div>
          <div class="footix-quip">${quipFor(last.pseudo || "?")}</div>
        `;
      } else {
        footixEl.innerHTML = "";
      }

      const nextPoints = {};
      rows.forEach(r => { nextPoints[r.joueur_id] = r[pointsKey] ?? 0; });
      previousPoints[key] = nextPoints;
    }

    async function refresh() {
      const { data: soiree } = await sb.from("soirees").select("*").eq("active", true).order("created_at", { ascending: false }).limit(1).maybeSingle();

      document.getElementById("soireeLabel").textContent = soiree
        ? (soiree.label || `Soirée du ${soiree.date}`)
        : "Pas de soirée active — top saison ci-dessous";

      if (soiree) {
        const { data: classementSoiree } = await sb.from("classement_soiree")
          .select("*").eq("soiree_id", soiree.id).order("points_soiree", { ascending: false }).limit(10);
        renderColumn("soiree", classementSoiree, "points_soiree", document.getElementById("podiumSoiree"), document.getElementById("restSoiree"), document.getElementById("footixSoiree"));
      } else {
        renderColumn("soiree", [], "points_soiree", document.getElementById("podiumSoiree"), document.getElementById("restSoiree"), document.getElementById("footixSoiree"));
      }

      const { data: classementSaison } = await sb.from("classement_saison")
        .select("*").order("points_total", { ascending: false }).limit(10);
      renderColumn("saison", classementSaison, "points_total", document.getElementById("podiumSaison"), document.getElementById("restSaison"), document.getElementById("footixSaison"));
    }

    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
