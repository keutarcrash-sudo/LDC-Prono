<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Classement — Predicto Arena 18</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #15223B;
    --border: #253758;
    --accent: #1E90FF;
    --accent-bright: #00F0FF;
    --gold: #FFD600;
    --silver: #C7D2E3;
    --bronze: #D89B5D;
    --text: #FFFFFF;
    --text-muted: #8B96AC;
  }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; }
  body { overflow-x: hidden; overscroll-behavior-x: none; }
  button, a, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Manrope', system-ui, sans-serif; margin: 0; color: var(--text); padding: 48px 40px 100px;
    background: linear-gradient(rgba(10,15,28,0.82), rgba(10,15,28,0.93)), url('assets/trophy.jpg') center/cover no-repeat fixed, var(--bg);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 3.4rem; letter-spacing: 1px;
    text-align: center; margin: 0; line-height: 1;
  }
  .subtitle { text-align: center; color: var(--text-muted); margin: 12px 0 48px; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; }
  .columns { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .col { flex: 1; min-width: 380px; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; }
  .col h2 {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; letter-spacing: 0.5px;
    border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-top: 0;
  }
  .col.saison h2 { border-bottom-color: var(--gold); }
  table { width: 100%; border-collapse: collapse; font-size: 1.4rem; }
  td { padding: 12px 6px; border-bottom: 1px solid var(--border); }
  .rank { color: var(--text-muted); width: 44px; font-weight: 800; font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; }
  .rank.gold { color: var(--gold); }
  .rank.silver { color: var(--silver); }
  .rank.bronze { color: var(--bronze); }
  .points { text-align: right; font-weight: 800; color: var(--accent-bright); }
  .col.saison .points { color: var(--gold); }
  .empty { color: var(--text-muted); font-style: italic; padding: 24px 0; font-size: 1.1rem; }

  @media (max-width: 600px) {
    body { padding: 24px 16px 100px; }
    h1 { font-size: 2rem; }
    .subtitle { margin-bottom: 24px; font-size: 1rem; }
    .col { min-width: 0; padding: 16px; }
    table { font-size: 1.1rem; }
  }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; max-width: 480px; margin: 0 auto;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--text-muted); text-decoration: none; font-size: 0.65rem;
    text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700;
  }
  .nav-item.active { color: var(--accent-bright); }
  .nav-icon { font-size: 1.3rem; }
  .svg-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.15em; }
  .svg-icon svg { width: 1em; height: 1em; display: block; }
</style>
</head>
<body>
  <h1><span class="svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3"/><path d="M12 12v3"/><path d="M8 20h8"/><path d="M9 20v-2a3 3 0 016 0v2"/></svg></span> Predicto — Ligue des Champions</h1>
  <div class="subtitle" id="soireeLabel">Chargement…</div>

  <div class="columns">
    <div class="col">
      <h2>Classement de la soirée</h2>
      <table id="tableSoiree"><tbody></tbody></table>
    </div>
    <div class="col saison">
      <h2>Top saison</h2>
      <table id="tableSaison"><tbody></tbody></table>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="pronostics.html" class="nav-item" id="navPronostics"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l3 2.2-1.1 3.6H10.1L9 9.2 12 7z" fill="currentColor" stroke="none"/><path d="M12 3v4M12 17v4M4.5 8l3.5 1M16 9l3.5-1M6 17l2.5-2.5M15.5 14.5L18 17"/></svg></span><span>Pronostics</span></a>
    <a href="classement.html" class="nav-item active"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v3a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 3M17 5h3a3 3 0 01-3 3"/><path d="M12 12v3"/><path d="M8 20h8"/><path d="M9 20v-2a3 3 0 016 0v2"/></svg></span><span>Classement</span></a>
    <a href="profil.html" class="nav-item"><span class="nav-icon svg-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></span><span>Profil</span></a>
  </nav>

  <script>
    (function () {
      const lastCode = localStorage.getItem("ldc_last_code");
      if (lastCode) document.getElementById("navPronostics").href = `pronostics.html?code=${lastCode}`;
    })();
  </script>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function rankLabel(i) {
      if (i === 0) return { cls: "rank gold", text: "🥇" };
      if (i === 1) return { cls: "rank silver", text: "🥈" };
      if (i === 2) return { cls: "rank bronze", text: "🥉" };
      return { cls: "rank", text: String(i + 1) };
    }

    function renderTable(tableId, rows, pointsKey) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td class="empty" colspan="3">Aucun prono pour l'instant</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((r, i) => {
        const rank = rankLabel(i);
        return `
        <tr>
          <td class="${rank.cls}">${rank.text}</td>
          <td>${r.pseudo}</td>
          <td class="points">${r[pointsKey] ?? 0} pts</td>
        </tr>
      `;
      }).join("");
    }

    async function refresh() {
      const { data: soiree } = await sb.from("soirees").select("*").eq("active", true).order("created_at", { ascending: false }).limit(1).maybeSingle();

      document.getElementById("soireeLabel").textContent = soiree
        ? (soiree.label || `Soirée du ${soiree.date}`)
        : "Pas de soirée active — top saison ci-dessous";

      if (soiree) {
        const { data: classementSoiree } = await sb.from("classement_soiree")
          .select("*").eq("soiree_id", soiree.id).order("points_soiree", { ascending: false }).limit(10);
        renderTable("tableSoiree", classementSoiree, "points_soiree");
      } else {
        renderTable("tableSoiree", [], "points_soiree");
      }

      const { data: classementSaison } = await sb.from("classement_saison")
        .select("*").order("points_total", { ascending: false }).limit(10);
      renderTable("tableSaison", classementSaison, "points_total");
    }

    refresh();
    setInterval(refresh, 20000);
  </script>
</body>
</html>
