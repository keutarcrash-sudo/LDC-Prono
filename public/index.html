<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Predicto — Arena 18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #15223B;
    --border: #253758;
    --accent: #1E90FF;
    --gold: #FFD600;
    --text: #FFFFFF;
    --text-muted: #8B96AC;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: linear-gradient(rgba(10,15,28,0.72), rgba(10,15,28,0.85)), url('assets/starball.jpg') center/cover, var(--bg);
    color: var(--text);
    min-height: 100vh; margin: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
  }
  .svg-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.08em; }
  .svg-icon svg { width: 1em; height: 1em; display: block; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 1px; margin: 0 0 4px; text-align: center; }
  .subtitle { color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
  a.link-card {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; color: var(--text); text-decoration: none; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.3px; text-align: center; transition: border-color 0.2s;
  }
  a.link-card:hover { border-color: var(--accent); }
  a.link-card.gold:hover { border-color: var(--gold); }
</style>
</head>
<body>

    <a class="link-card" href="profil.html">👤 Mon profil</a>
  </div>
</body>
</html>
