<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Predicto Arena 18</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #15223B;
    --border: #253758;
    --accent: #1E90FF;
    --accent-bright: #00F0FF;
    --gold: #FFD600;
    --success: #00E6A1;
    --danger: #FF5C6C;
    --text: #FFFFFF;
    --text-muted: #8B96AC;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Manrope', system-ui, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px 60px; color: var(--text);
    background: linear-gradient(rgba(10,15,28,0.95), rgba(10,15,28,0.98)), url('assets/dark-grass.png') bottom center/cover no-repeat fixed, var(--bg);
  }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.5px; margin-bottom: 4px; }
  h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.5px; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
  h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.3px; font-weight: normal; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 10px 0 4px; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  input, button { font-size: 1rem; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; }
  input { width: 100%; background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; cursor: pointer; margin-top: 12px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; font-size: 0.9rem; }
  button:hover { background: #1678d6; }
  button.secondary { background: var(--border); color: var(--text); }
  button.secondary:hover { background: #33456b; }
  .match-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  .match-label { display: flex; align-items: center; gap: 6px; }
  .team-badge { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); vertical-align: middle; }
  .team-badge img { width: 100%; height: 100%; object-fit: contain; }
  .team-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 0.7rem; background: linear-gradient(135deg, var(--accent), #0e4f8f); color: white; }
  .match-row:last-child { border-bottom: none; }
  .score-edit { display: flex; align-items: center; gap: 6px; }
  .score-edit input { width: 46px; text-align: center; }
  #qrcode { background: white; padding: 12px; display: inline-block; border-radius: 8px; margin-top: 12px; }
  .msg { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 0.9rem; font-weight: 700; }
  .msg.ok { background: rgba(0,230,161,0.15); color: var(--success); }
  .msg.err { background: rgba(255,92,108,0.15); color: var(--danger); }
  .soiree-block { margin-top: 24px; }
  .link-box { font-size: 0.85rem; word-break: break-all; color: var(--text-muted); margin-top: 8px; }
  .code-tag { color: var(--gold); font-weight: 800; }
  .active-badge { display: inline-block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 999px; }
  .active-badge.on { background: rgba(0,230,161,0.15); color: var(--success); }
  .active-badge.off { background: rgba(139,150,172,0.15); color: var(--text-muted); }
  .btn-toggle-active { margin: 0; padding: 6px 12px; font-size: 0.75rem; }

  .tabbar { display: flex; gap: 8px; margin: 18px 0 24px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: transparent; color: var(--text-muted); border: none; margin: 0;
    padding: 10px 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.85rem;
    border-bottom: 3px solid transparent; border-radius: 0; cursor: pointer;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn .count { display: inline-block; background: var(--gold); color: var(--bg); border-radius: 999px; font-size: 0.7rem; padding: 1px 7px; margin-left: 6px; }
  [hidden] { display: none !important; }
  .pending-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  .pending-row:last-child { border-bottom: none; }
  .pending-date { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
</style>
</head>
<body>
  <h1>⚙️ Admin — Predicto Arena 18</h1>
  <p style="color:var(--text-muted); font-size:0.9rem;">Ne partage ce lien qu'avec l'équipe de l'Arena. Il permet de créer les soirées et de modifier les résultats.</p>

  <div class="tabbar">
    <button type="button" class="tab-btn active" data-tab="soirees">Soirées</button>
    <button type="button" class="tab-btn" data-tab="resultats">Résultats à saisir <span class="count" id="pendingCount" hidden>0</span></button>
  </div>

  <section id="tab-soirees">
    <div class="card">
      <h2 style="margin-top:0; border:none; padding-top:0;">Créer une soirée</h2>
      <label for="date">Date de la soirée</label>
      <input type="date" id="date" />
      <label for="label">Nom de la soirée (optionnel)</label>
      <input type="text" id="label" placeholder="ex: Soirée Journée 3" />
      <label for="recompense">Récompense de la soirée</label>
      <input type="text" id="recompense" placeholder="ex: 1 boisson offerte : demi blonde, soft (hors energy drink) ou vin (blanc/rouge/rosé) au choix" value="1 boisson offerte : demi blonde, soft (hors energy drink) ou vin (blanc/rouge/rosé) au choix" />
      <button id="btnCreate">Créer la soirée et importer les matchs</button>
      <div id="createMsg"></div>
    </div>

    <h2>Soirées existantes</h2>
    <div id="soireesList"></div>
  </section>

  <section id="tab-resultats" hidden>
    <h2 style="margin-top:0; border:none; padding-top:0;">Matchs sans résultat</h2>
    <p style="color:var(--text-muted); font-size:0.85rem;">Vue rapide de tous les matchs (toutes soirées) qui attendent encore un score final.</p>
    <div class="card" id="pendingList"></div>
  </section>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY, SITE_BASE_URL } = window.APP_CONFIG;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function teamBadge(name, logoUrl) {
      const initial = (name || "?").charAt(0).toUpperCase();
      const fallback = `<span class="team-fallback" style="${logoUrl ? "display:none;" : ""}">${initial}</span>`;
      const img = logoUrl
        ? `<img src="${logoUrl}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />`
        : "";
      return `<span class="team-badge">${img}${fallback}</span>`;
    }

    function randomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function showMsg(el, text, ok) {
      el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
    }

    async function fetchMatchesForDate(dateStr) {
      // Passe par la fonction serveur /api/matches (voir api/matches.js) :
      // l'API football-data.org bloque les appels directs depuis un navigateur.
      const res = await fetch(`/api/matches?date=${dateStr}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Erreur API football-data.org (${res.status})`);
      return data.matches || [];
    }

    document.getElementById("btnCreate").addEventListener("click", async () => {
      const dateInput = document.getElementById("date").value;
      const label = document.getElementById("label").value.trim();
      const recompense = document.getElementById("recompense").value.trim();
      const msgEl = document.getElementById("createMsg");
      if (!dateInput) { showMsg(msgEl, "Choisis une date.", false); return; }

      try {
        showMsg(msgEl, "Import des matchs en cours…", true);
        const apiMatches = await fetchMatchesForDate(dateInput);

        // Une seule soirée active à la fois : la nouvelle devient la soirée courante.
        await sb.from("soirees").update({ active: false }).neq("id", "00000000-0000-0000-0000-000000000000");

        const { data: soiree, error: err1 } = await sb.from("soirees").insert({
          date: dateInput,
          code_qr: randomCode(),
          label: label || null,
          recompense: recompense || null,
          active: true,
        }).select().single();
        if (err1) throw err1;

        if (apiMatches.length > 0) {
          const rows = apiMatches.map(m => ({
            soiree_id: soiree.id,
            external_match_id: String(m.id),
            equipe_domicile: m.homeTeam?.shortName || m.homeTeam?.name || "?",
            equipe_exterieur: m.awayTeam?.shortName || m.awayTeam?.name || "?",
            logo_domicile: m.homeTeam?.crest || null,
            logo_exterieur: m.awayTeam?.crest || null,
            coup_envoi: m.utcDate,
            statut: m.status,
          }));
          const { error: err2 } = await sb.from("matchs").insert(rows);
          if (err2) throw err2;
          showMsg(msgEl, `Soirée créée avec ${rows.length} match(s) importé(s).`, true);
        } else {
          showMsg(msgEl, "Soirée créée, mais aucun match Ligue des Champions trouvé à cette date sur l'API. Tu peux ajouter un match manuellement plus bas.", true);
        }

        document.getElementById("date").value = "";
        document.getElementById("label").value = "";
        document.getElementById("recompense").value = "1 boisson offerte : demi blonde, soft (hors energy drink) ou vin (blanc/rouge/rosé) au choix";
        loadSoirees();
      } catch (e) {
        showMsg(msgEl, "Erreur : " + e.message, false);
      }
    });

    async function syncResults(soiree, matchs, containerEl) {
      const msgEl = containerEl.querySelector(".sync-msg");
      showMsg(msgEl, "Actualisation des résultats…", true);
      try {
        const apiMatches = await fetchMatchesForDate(soiree.date);
        const byId = {};
        apiMatches.forEach(m => byId[String(m.id)] = m);

        let updated = 0;
        for (const m of matchs) {
          const apiMatch = m.external_match_id ? byId[m.external_match_id] : null;
          if (apiMatch && apiMatch.status === "FINISHED" && apiMatch.score?.fullTime) {
            const { error } = await sb.from("matchs").update({
              score_domicile: apiMatch.score.fullTime.home,
              score_exterieur: apiMatch.score.fullTime.away,
              statut: "FINISHED",
            }).eq("id", m.id);
            if (!error) updated++;
          }
        }
        showMsg(msgEl, `${updated} match(s) mis à jour.`, true);
        loadSoirees();
      } catch (e) {
        showMsg(msgEl, "Erreur : " + e.message, false);
      }
    }

    async function saveManualScore(matchId, homeVal, awayVal, msgEl) {
      const h = parseInt(homeVal, 10), a = parseInt(awayVal, 10);
      if (Number.isNaN(h) || Number.isNaN(a)) { showMsg(msgEl, "Scores invalides.", false); return; }
      const { error } = await sb.from("matchs").update({ score_domicile: h, score_exterieur: a, statut: "FINISHED" }).eq("id", matchId);
      if (error) { showMsg(msgEl, "Erreur : " + error.message, false); return; }
      showMsg(msgEl, "Score enregistré, points recalculés.", true);
      loadPendingResults();
    }

    async function addManualMatch(soireeId, home, away, kickoffLocal, msgEl) {
      if (!home.trim() || !away.trim() || !kickoffLocal) {
        showMsg(msgEl, "Renseigne les deux équipes et l'heure du coup d'envoi.", false);
        return;
      }
      const { error } = await sb.from("matchs").insert({
        soiree_id: soireeId,
        equipe_domicile: home.trim(),
        equipe_exterieur: away.trim(),
        coup_envoi: new Date(kickoffLocal).toISOString(),
        statut: "SCHEDULED",
      });
      if (error) { showMsg(msgEl, "Erreur : " + error.message, false); return; }
      loadSoirees();
    }

    async function loadSoirees() {
      const listEl = document.getElementById("soireesList");
      const { data: soirees, error } = await sb.from("soirees").select("*").order("date", { ascending: false });
      if (error) { listEl.innerHTML = `<div class="msg err">Erreur : ${error.message}</div>`; return; }

      listEl.innerHTML = "";
      for (const soiree of soirees) {
        const { data: matchs } = await sb.from("matchs").select("*").eq("soiree_id", soiree.id).order("coup_envoi");
        const block = document.createElement("div");
        block.className = "card soiree-block";

        const link = `${SITE_BASE_URL}pronostics.html?code=${soiree.code_qr}`;
        const rewardBlockHtml = `
          <div class="match-row" style="border-bottom:none; flex-wrap:wrap; gap:8px; padding:8px 0 0;">
            <input type="text" class="input-recompense" value="${soiree.recompense || ""}" style="width:auto; flex:1; min-width:200px;" />
            <button class="secondary btn-save-recompense" type="button" style="margin:0; padding:8px 12px; font-size:0.8rem;">Enregistrer</button>
          </div>
          <p class="hint" style="color:var(--text-muted); font-size:0.78rem; margin:4px 0 0;">🎯 Rappel : un score exact sur un match donne droit à une boisson offerte, pour chaque joueur qui l'a trouvé.</p>
        `;
        block.innerHTML = `
          <h3 style="margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span>${soiree.label || "Soirée"} — ${soiree.date} <span class="code-tag">${soiree.code_qr}</span></span>
            <span class="active-badge ${soiree.active ? "on" : "off"}">${soiree.active ? "🟢 Active" : "⚪ Inactive"}</span>
            <button class="secondary btn-toggle-active" type="button">${soiree.active ? "Désactiver" : "Activer"}</button>
            <button class="secondary btn-delete-soiree" type="button" style="color:var(--danger);">🗑️ Supprimer</button>
          </h3>
          <p class="hint" style="margin:2px 0 0;">${soiree.active ? "Le QR de cette soirée fonctionne dès maintenant, quelle que soit la date." : "Prête, mais le QR ne fonctionnera pas tant qu'elle n'est pas activée."}</p>
          ${rewardBlockHtml}
          <div id="qr-${soiree.id}"></div>
          <div class="link-box">${link}</div>
          <div class="matches"></div>
          <div class="add-match-form">
            <div class="match-row" style="border-bottom:none; flex-wrap:wrap; gap:8px;">
              <input type="text" class="input-home" placeholder="Équipe domicile" style="width:auto; flex:1; min-width:120px;" />
              <input type="text" class="input-away" placeholder="Équipe extérieur" style="width:auto; flex:1; min-width:120px;" />
              <input type="datetime-local" class="input-kickoff" style="width:auto;" />
              <button class="secondary btn-add-match" type="button">+ Ajouter un match</button>
            </div>
          </div>
          <button class="secondary btn-sync">Actualiser les résultats depuis l'API</button>
          <div class="sync-msg"></div>
        `;
        listEl.appendChild(block);

        new QRCode(block.querySelector(`#qr-${soiree.id}`), { text: link, width: 160, height: 160 });

        const matchIds = (matchs || []).map(m => m.id);
        let exactCounts = {};
        if (matchIds.length > 0) {
          const { data: exactRows } = await sb.from("pronostics").select("match_id").in("match_id", matchIds).eq("points", 5);
          (exactRows || []).forEach(r => { exactCounts[r.match_id] = (exactCounts[r.match_id] || 0) + 1; });
        }

        const matchesEl = block.querySelector(".matches");
        (matchs || []).forEach(m => {
          const row = document.createElement("div");
          row.className = "match-row";
          const kickoff = new Date(m.coup_envoi).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
          const exactBadge = exactCounts[m.id] ? ` <span class="code-tag">🎯 ${exactCounts[m.id]}</span>` : "";
          row.innerHTML = `
            <span class="match-label">${kickoff} — ${teamBadge(m.equipe_domicile, m.logo_domicile)} ${m.equipe_domicile} vs ${teamBadge(m.equipe_exterieur, m.logo_exterieur)} ${m.equipe_exterieur}${exactBadge}</span>
            <span class="score-edit">
              <input type="number" min="0" value="${m.score_domicile ?? ''}" placeholder="-" />
              <span>-</span>
              <input type="number" min="0" value="${m.score_exterieur ?? ''}" placeholder="-" />
              <button class="secondary btn-save-score">Enregistrer</button>
            </span>
          `;
          const inputs = row.querySelectorAll("input");
          row.querySelector(".btn-save-score").addEventListener("click", () => {
            saveManualScore(m.id, inputs[0].value, inputs[1].value, block.querySelector(".sync-msg"));
          });
          matchesEl.appendChild(row);
        });

        block.querySelector(".btn-sync").addEventListener("click", () => syncResults(soiree, matchs || [], block));

        block.querySelector(".btn-add-match").addEventListener("click", () => {
          const home = block.querySelector(".input-home").value;
          const away = block.querySelector(".input-away").value;
          const kickoff = block.querySelector(".input-kickoff").value;
          addManualMatch(soiree.id, home, away, kickoff, block.querySelector(".sync-msg"));
        });

        const btnSaveRecompense = block.querySelector(".btn-save-recompense");
        if (btnSaveRecompense) {
          btnSaveRecompense.addEventListener("click", async () => {
            const value = block.querySelector(".input-recompense").value.trim();
            await sb.from("soirees").update({ recompense: value || null }).eq("id", soiree.id);
            loadSoirees();
          });
        }

        block.querySelector(".btn-toggle-active").addEventListener("click", async () => {
          if (!soiree.active) {
            // Une seule soirée active à la fois : on désactive les autres.
            await sb.from("soirees").update({ active: false }).neq("id", soiree.id);
          }
          await sb.from("soirees").update({ active: !soiree.active }).eq("id", soiree.id);
          loadSoirees();
        });

        block.querySelector(".btn-delete-soiree").addEventListener("click", async () => {
          const label = soiree.label || `Soirée du ${soiree.date}`;
          if (!confirm(`Supprimer définitivement "${label}" ? Tous ses matchs et pronostics seront aussi supprimés. Cette action est irréversible.`)) return;
          const { error } = await sb.from("soirees").delete().eq("id", soiree.id);
          if (error) alert("Erreur : " + error.message);
          loadSoirees();
        });
      }
    }

    async function loadPendingResults() {
      const listEl = document.getElementById("pendingList");
      const countEl = document.getElementById("pendingCount");
      const { data, error } = await sb
        .from("matchs")
        .select("*, soirees(date, label)")
        .is("score_domicile", null)
        .order("coup_envoi");

      if (error) { listEl.innerHTML = `<div class="msg err">Erreur : ${error.message}</div>`; return; }

      if (!data || data.length === 0) {
        countEl.hidden = true;
        listEl.innerHTML = `<p style="color:var(--text-muted);">Tout est à jour, aucun résultat en attente.</p>`;
        return;
      }

      countEl.hidden = false;
      countEl.textContent = data.length;
      listEl.innerHTML = "";
      data.forEach(m => {
        const kickoff = new Date(m.coup_envoi).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        const row = document.createElement("div");
        row.className = "pending-row";
        row.innerHTML = `
          <div>
            <div class="pending-date">${m.soirees?.label || "Soirée"} — ${kickoff}</div>
            <div class="match-label">${teamBadge(m.equipe_domicile, m.logo_domicile)} ${m.equipe_domicile} vs ${teamBadge(m.equipe_exterieur, m.logo_exterieur)} ${m.equipe_exterieur}</div>
          </div>
          <span class="score-edit">
            <input type="number" min="0" placeholder="-" />
            <span>-</span>
            <input type="number" min="0" placeholder="-" />
            <button class="secondary btn-save-score">Enregistrer</button>
          </span>
        `;
        const inputs = row.querySelectorAll("input");
        const msgHolder = document.createElement("div");
        row.appendChild(msgHolder);
        row.querySelector(".btn-save-score").addEventListener("click", () => {
          saveManualScore(m.id, inputs[0].value, inputs[1].value, msgHolder).then(loadSoirees);
        });
        listEl.appendChild(row);
      });
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-soirees").hidden = btn.dataset.tab !== "soirees";
        document.getElementById("tab-resultats").hidden = btn.dataset.tab !== "resultats";
        if (btn.dataset.tab === "resultats") loadPendingResults();
      });
    });

    loadSoirees();
    loadPendingResults();
  </script>
</body>
</html>
