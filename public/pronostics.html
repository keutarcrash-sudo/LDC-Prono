<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pronostics — Arena 18</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0F1C;
    --surface: #15223B;
    --surface-2: #1B2C4C;
    --border: #253758;
    --accent: #1E90FF;
    --accent-bright: #00F0FF;
    --gold: #FFD600;
    --success: #00E6A1;
    --danger: #FF5C6C;
    --closed: #7C6CE0;
    --text: #FFFFFF;
    --text-muted: #8B96AC;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    max-width: 480px; margin: 0 auto; padding: 24px 16px 60px;
    background: var(--bg); color: var(--text);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; letter-spacing: 0.5px; text-align: center; margin: 4px 0 0;
    line-height: 1.05;
  }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 6px 0 24px; text-transform: uppercase; letter-spacing: 1px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  label { display: block; margin: 12px 0 5px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  input, button { font-size: 1rem; padding: 12px; border-radius: 8px; border: 1px solid var(--border); width: 100%; font-family: inherit; }
  input { background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; cursor: pointer; margin-top: 18px; font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px; text-transform: uppercase; padding: 14px; }
  button:hover { background: #1678d6; }
  button:active { transform: scale(0.99); }
  .hint { color: var(--text-muted); font-size: 0.78rem; margin-top: 6px; }
  .match-card { margin-bottom: 12px; border-left: 3px solid var(--accent); transition: border-color 0.3s, opacity 0.3s; }
  .match-card.closing { border-left-color: var(--gold); }
  .match-card.closed { border-left-color: var(--closed); opacity: 0.55; }
  .teams { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 8px; font-size: 1.05rem; }
  .teams span:nth-child(2) { color: var(--text-muted); font-weight: 500; font-size: 0.85rem; }
  .match-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kickoff { color: var(--text-muted); font-size: 0.8rem; }
  .state-badge { display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: rgba(30,144,255,0.15); color: var(--accent-bright); }
  .state-badge.closing { background: rgba(255,214,0,0.15); color: var(--gold); }
  .state-badge.closed { background: rgba(124,108,224,0.18); color: var(--closed); }
  .score-inputs { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .score-inputs input { width: 68px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 10px; }
  .score-inputs span { color: var(--text-muted); font-weight: 800; font-size: 1.2rem; }
  .msg { padding: 14px; border-radius: 10px; margin-top: 12px; font-size: 0.95rem; text-align: center; font-weight: 700; }
  .msg.ok { background: rgba(0,230,161,0.15); color: var(--success); }
  .msg.err { background: rgba(255,92,108,0.15); color: var(--danger); }
  #app { display: none; }
  #invalidCode h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1px; color: var(--closed); margin: 0 0 8px; }
</style>
</head>
<body>
  <h1>⚽ Prono. Grimpe au classement.</h1>
  <div class="subtitle">Ligue des Champions — Arena 18</div>

  <div id="invalidCode" class="card" style="display:none; text-align:center;">
    <h2>QR expiré</h2>
    <p>Ce lien n'est plus valable.</p>
    <p class="hint">Scanne le QR code affiché ce soir à l'Arena 18 pour pronostiquer les matchs de la soirée.</p>
  </div>

  <div id="loading" class="card" style="text-align:center;">Chargement…</div>

  <div id="app">
    <div class="card" id="identityCard">
      <label for="pseudo">Ton pseudo</label>
      <input type="text" id="pseudo" placeholder="ex: Julien" maxlength="30" />
      <label for="phone">Ton téléphone</label>
      <input type="tel" id="phone" placeholder="ex: 0612345678" />
      <p class="hint">Ça sert juste à te retrouver au classement de la saison, d'une soirée à l'autre.</p>
    </div>

    <div id="matchesContainer"></div>

    <button id="btnSubmit">Je valide mes pronos</button>
    <div id="submitMsg"></div>
  </div>

  <script>
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.APP_CONFIG;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const code = (params.get("code") || "").toUpperCase().trim();

    const CLOSING_SOON_MS = 15 * 60 * 1000; // "bientôt fermé" dans les 15 dernières minutes

    let soiree = null;
    let matchs = [];
    let joueurId = localStorage.getItem("ldc_joueur_id") || null;

    function todayStr() {
      // Date locale (pas UTC) pour matcher la date choisie dans admin.html,
      // qui vient d'un <input type="date"> toujours exprimé en heure locale.
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function showMsg(el, text, ok) {
      el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
    }

    function formatCountdown(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    async function init() {
      if (!code) { fail(); return; }

      const { data, error } = await sb.from("soirees").select("*").eq("code_qr", code).maybeSingle();
      if (error || !data) { fail(); return; }

      if (data.date !== todayStr()) { fail(); return; }

      soiree = data;
      const { data: m, error: mErr } = await sb.from("matchs").select("*").eq("soiree_id", soiree.id).order("coup_envoi");
      if (mErr) { fail(); return; }
      matchs = m || [];

      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "block";

      const savedPseudo = localStorage.getItem("ldc_pseudo");
      const savedPhone = localStorage.getItem("ldc_phone");
      if (savedPseudo) document.getElementById("pseudo").value = savedPseudo;
      if (savedPhone) document.getElementById("phone").value = savedPhone;

      renderMatches();
      updateMatchStates();
      setInterval(updateMatchStates, 1000);

      if (savedPhone) {
        await loadExistingPronostics(savedPhone);
      }
    }

    function fail() {
      document.getElementById("loading").style.display = "none";
      document.getElementById("invalidCode").style.display = "block";
    }

    function renderMatches() {
      const container = document.getElementById("matchesContainer");
      container.innerHTML = "";
      matchs.forEach(m => {
        const kickoff = new Date(m.coup_envoi);
        const card = document.createElement("div");
        card.className = "card match-card";
        card.dataset.matchId = m.id;
        card.innerHTML = `
          <div class="teams"><span>${m.equipe_domicile}</span><span>vs</span><span>${m.equipe_exterieur}</span></div>
          <div class="match-meta">
            <span class="kickoff">${kickoff.toLocaleString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</span>
            <span class="state-badge" data-badge="${m.id}">Ouvert</span>
          </div>
          <div class="score-inputs">
            <input type="number" min="0" max="20" data-match="${m.id}" data-side="home" />
            <span>-</span>
            <input type="number" min="0" max="20" data-match="${m.id}" data-side="away" />
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateMatchStates() {
      const now = new Date();
      matchs.forEach(m => {
        const kickoff = new Date(m.coup_envoi);
        const remaining = kickoff - now;
        const card = document.querySelector(`.match-card[data-match-id="${m.id}"]`);
        const badge = document.querySelector(`[data-badge="${m.id}"]`);
        const homeInput = document.querySelector(`input[data-match="${m.id}"][data-side="home"]`);
        const awayInput = document.querySelector(`input[data-match="${m.id}"][data-side="away"]`);
        if (!card || !badge) return;

        card.classList.remove("closing", "closed");
        badge.classList.remove("closing", "closed");

        if (remaining <= 0) {
          card.classList.add("closed");
          badge.classList.add("closed");
          badge.textContent = "Fermé";
          if (homeInput) homeInput.disabled = true;
          if (awayInput) awayInput.disabled = true;
        } else if (remaining <= CLOSING_SOON_MS) {
          card.classList.add("closing");
          badge.classList.add("closing");
          badge.textContent = `⏱ ${formatCountdown(remaining)}`;
        } else {
          badge.textContent = "Ouvert";
        }
      });
    }

    async function loadExistingPronostics(phone) {
      const { data: joueur } = await sb.from("joueurs").select("*").eq("phone", phone).maybeSingle();
      if (!joueur) return;
      joueurId = joueur.id;
      const matchIds = matchs.map(m => m.id);
      if (matchIds.length === 0) return;
      const { data: existing } = await sb.from("pronostics").select("*").eq("joueur_id", joueur.id).in("match_id", matchIds);
      (existing || []).forEach(p => {
        const homeInput = document.querySelector(`input[data-match="${p.match_id}"][data-side="home"]`);
        const awayInput = document.querySelector(`input[data-match="${p.match_id}"][data-side="away"]`);
        if (homeInput) homeInput.value = p.score_domicile_predit;
        if (awayInput) awayInput.value = p.score_exterieur_predit;
      });
    }

    document.getElementById("btnSubmit").addEventListener("click", async () => {
      const msgEl = document.getElementById("submitMsg");
      const pseudo = document.getElementById("pseudo").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (!pseudo || !phone) { showMsg(msgEl, "Pseudo + téléphone obligatoires pour jouer.", false); return; }

      try {
        let { data: joueur } = await sb.from("joueurs").select("*").eq("phone", phone).maybeSingle();
        if (joueur) {
          if (joueur.pseudo !== pseudo) {
            await sb.from("joueurs").update({ pseudo }).eq("id", joueur.id);
          }
        } else {
          const { data: newJoueur, error: jErr } = await sb.from("joueurs").insert({ phone, pseudo }).select().single();
          if (jErr) throw jErr;
          joueur = newJoueur;
        }
        joueurId = joueur.id;
        localStorage.setItem("ldc_joueur_id", joueurId);
        localStorage.setItem("ldc_pseudo", pseudo);
        localStorage.setItem("ldc_phone", phone);

        const now = new Date();
        const rows = [];
        for (const m of matchs) {
          const kickoff = new Date(m.coup_envoi);
          if (now >= kickoff) continue;
          const homeInput = document.querySelector(`input[data-match="${m.id}"][data-side="home"]`);
          const awayInput = document.querySelector(`input[data-match="${m.id}"][data-side="away"]`);
          if (homeInput.value === "" || awayInput.value === "") continue;
          rows.push({
            joueur_id: joueur.id,
            match_id: m.id,
            score_domicile_predit: parseInt(homeInput.value, 10),
            score_exterieur_predit: parseInt(awayInput.value, 10),
          });
        }

        if (rows.length === 0) { showMsg(msgEl, "Renseigne au moins un prono avant d'envoyer.", false); return; }

        const { error: pErr } = await sb.from("pronostics").upsert(rows, { onConflict: "joueur_id,match_id" });
        if (pErr) throw pErr;

        showMsg(msgEl, `🔥 Pronos enregistrés pour ${rows.length} match(s) ! Rendez-vous au classement.`, true);
      } catch (e) {
        showMsg(msgEl, "Erreur : " + e.message, false);
      }
    });

    init();
  </script>
</body>
</html>
